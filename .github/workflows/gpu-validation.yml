name: Prepare manual GPU validation (no GPU test)
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open same-repository PR containing the trusted commit
        required: true
        type: string
      expected_sha:
        description: Exact reviewed PR head commit SHA
        required: true
        type: string
      platform:
        description: Native platform on which validation will be performed manually
        required: true
        type: choice
        options:
          - Windows
          - Linux
          - macOS
permissions:
  contents: read
  pull-requests: read
jobs:
  prepare:
    # Workflow code is dispatched from main; no self-hosted runner is used.
    if: github.repository == 'lubacareer/jupiter' && github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    name: Verify PR for manual GPU validation (no hardware test)
    runs-on: ubuntu-latest
    steps:
      - name: Verify selected PR and write manual instructions
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          REPOSITORY: ${{ github.repository }}
          PLATFORM: ${{ inputs.platform }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo 'PR number must be a positive integer.' >&2; exit 1; }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Expected SHA must be a full lowercase commit SHA.' >&2; exit 1; }
          case "$PLATFORM" in Windows|Linux|macOS) ;; *) echo 'Unsupported platform.' >&2; exit 1 ;; esac
          pr=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")
          jq -e --arg repo "$REPOSITORY" --arg sha "$EXPECTED_SHA" \
            '.state == "open" and .base.ref == "main" and .head.repo.full_name == $repo and .head.sha == $sha' <<< "$pr" >/dev/null \
            || { echo 'Select an open same-repository PR targeting main with the expected head SHA.' >&2; exit 1; }
          {
            printf '## Manual %s GPU validation\n\n' "$PLATFORM"
            printf '**No GPU hardware test was performed by this workflow.**\n\n'
            printf 'On a trusted %s machine with hardware WebGPU support, run from a checkout of this repository:\n\n' "$PLATFORM"
            printf '```bash\n'
            printf 'git fetch origin refs/pull/%s/head\n' "$PR_NUMBER"
            printf 'git switch --detach %s\n' "$EXPECTED_SHA"
            printf 'npm ci\nnpm test\nnpm run build\nnpx electron-builder --dir --publish never\nnode electron/run-packaged-gpu.cjs\n'
            printf '```\n\n'
            printf 'Inspect gpu-validation-report.json and verify the hardware adapter and accuracy checks. Save the report for review.\n'
          } >> "$GITHUB_STEP_SUMMARY"
