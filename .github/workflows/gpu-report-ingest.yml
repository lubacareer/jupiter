name: Ingest self-reported GPU validation
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full commit SHA used for the cloud validation
        required: true
        type: string
      platform:
        description: Platform reported by the validation machine
        required: true
        type: choice
        options: [Windows, Linux, macOS]
      provider:
        description: Cloud provider name, without credentials or IP addresses
        required: true
        type: string
      report_base64:
        description: Base64 submission generated by scripts/run-cloud-gpu.cjs
        required: true
        type: string
permissions:
  contents: read
jobs:
  ingest:
    if: github.repository == 'lubacareer/jupiter' && github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    name: Retain self-reported, unverified GPU result
    runs-on: ubuntu-latest
    steps:
      - name: Verify commit exists in this repository
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid full commit SHA.' >&2; exit 1; }
          gh api "repos/$REPOSITORY/commits/$COMMIT_SHA" --jq '.sha' | grep -Fx "$COMMIT_SHA" >/dev/null
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.2'
      - name: Validate report and label provenance
        env:
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
          INPUT_PLATFORM: ${{ inputs.platform }}
          INPUT_PROVIDER: ${{ inputs.provider }}
          INPUT_REPORT_BASE64: ${{ inputs.report_base64 }}
        run: node scripts/gpu-report-ingest.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gpu-report-self-reported-unverified-${{ inputs.platform }}-${{ inputs.commit_sha }}-${{ github.run_id }}
          path: gpu-report-artifact/
          retention-days: 90
          if-no-files-found: error
